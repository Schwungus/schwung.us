name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [rework]
    paths:
      - .github/workflows/deploy.yml
      - www/**

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Render & publish
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Publish
        id: publish
        uses: nonk123/sanity-action@master
        with:
          push_to_github_pages: true
